[project]
name = "deeranalysis"
version = "0.1.0"
description = "A graphical fitting and data managment tool for DEER spectroscopy."
authors = [
    {name = "Hugo Karas",email = "hkaras@ethz.ch"}
]
readme = "README.md"
packages = [{include = "deeranalysis", from = "src"}]
requires-python = ">=3.13,<4"

dependencies = [
    "deerlab (>=1.1.5,<2.0.0)",
    "numpy (>=2.4.0,<3.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "xarray (>=2025.12.0,<2026.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "dash (>=3.3.0,<4.0.0)",
    "dash-bootstrap-components (>=2.0.4,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "dash-ag-grid (>=32.3.4,<33.0.0)",
    "dash-mantine-components (>=2.4.1,<3.0.0)",
    "dash-iconify (>=0.1.2,<0.2.0)",
    "psutil (>=7.2.1,<8.0.0)",
    "onnxruntime (>=1.23.2,<2.0.0)"
]

[tool.poetry.scripts]
deeranalysis = "deeranalysis.app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=deeranalysis --cov-report=term-missing"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
