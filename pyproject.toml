[project]
name = "deeranalysis"
version = "2026.0.1"
description = "A graphical fitting and data managment tool for DEER spectroscopy, using DeerLab and DeerNet as fitting engines."
authors = [
    {name = "Hugo Karas",email = "hkaras@ethz.ch"}
]
readme = "README.md"
packages = [{include = "deeranalysis", from = "src"}]
requires-python = ">=3.12"

dependencies = [
    "deerlab (>=1.1.5,<2.0.0)",
    "numpy (>=2.3.0,<3.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "xarray (>=2025.12.0,<2026.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "dash (>=4.0.0,<5.0.0)",
    "dash-bootstrap-components (>=2.0.4,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "dash-ag-grid (>=32.3.4,<33.0.0)",
    "dash-mantine-components (>=2.4.1,<3.0.0)",
    "dash-iconify (>=0.1.2,<0.2.0)",
    "psutil (>=7.2.1,<8.0.0)",
    "h5py (>=3.15.1,<4.0.0)",
    "onnxruntime (>=1.23.2,<2.0.0)",
    "logs-py (<4.0.35)",
    "pyepr-esr (>=1.0,<2.0)",
    "pywebview (>=6.1)",
    "sqlalchemy (>2.0)",
    "quadprog (>=0.1.13)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=deeranalysis --cov-report=term-missing"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

