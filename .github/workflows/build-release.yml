name: Build and Release

on:
  push:
    branches:
      - 'release/**'  # Triggers on release branches like release/v1.0.0
  workflow_dispatch:  # Allows manual triggering via GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
      
      - name: Build with PyInstaller
        run: |
          pyinstaller DeerAnalysis.spec
      
      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Prepare artifact name
        id: artifact_name
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ARTIFACT_NAME="DeerAnalysis-${{ steps.get_version.outputs.version }}-linux"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ARTIFACT_NAME="DeerAnalysis-${{ steps.get_version.outputs.version }}-macos"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ARTIFACT_NAME="DeerAnalysis-${{ steps.get_version.outputs.version }}-windows"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf ${{ steps.artifact_name.outputs.artifact_name }}.tar.gz DeerAnalysis
      
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ${{ steps.artifact_name.outputs.artifact_name }}.zip DeerAnalysis.app
      
      - name: Package Windows build
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path DeerAnalysis.exe -DestinationPath ${{ steps.artifact_name.outputs.artifact_name }}.zip
        shell: pwsh
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  create_release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Prepare release files
        run: |
          mkdir release-files
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -la release-files/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
