name: Build and Release

on:
  push:
    branches:
      - 'release/**'  # Triggers on release branches like release/v1.0.0
  workflow_dispatch:  # Allows manual triggering via GitHub UI

jobs:
  # Windows and macOS: standalone executables built with PyInstaller.
  build-desktop:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            spec: packaging/pyinstaller/DeerAnalysis_MacOS.spec
          - os: windows-latest
            spec: packaging/pyinstaller/DeerAnalysis_Win.spec
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build with PyInstaller
        run: pyinstaller "${{ matrix.spec }}"

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Prepare artifact name
        id: artifact_name
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ARTIFACT_NAME="DeerAnalysis-${{ steps.get_version.outputs.version }}-macos"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ARTIFACT_NAME="DeerAnalysis-${{ steps.get_version.outputs.version }}-windows"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "${{ steps.artifact_name.outputs.artifact_name }}.zip" DeerAnalysis.app

      - name: Package Windows build
        if: runner.os == 'Windows'
        # The Win spec names the executable "DeerAnalysis 2026.exe".
        run: |
          cd dist
          Compress-Archive -Path "DeerAnalysis 2026.exe" -DestinationPath "${{ steps.artifact_name.outputs.artifact_name }}.zip"
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: dist/*.zip
          retention-days: 7

  # Linux: Flatpak bundle built with flatpak-builder.
  #
  build-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python3 -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: DeerAnalysis.flatpak
          manifest-path: packaging/flatpak/io.github.JeschkeLab.DeerAnalysis.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeerAnalysis-${{ steps.get_version.outputs.version }}-linux
          path: DeerAnalysis.flatpak
          retention-days: 7

  create_release:
    name: Create GitHub Release
    needs: [build-desktop, build-flatpak]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir release-files
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.flatpak" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
